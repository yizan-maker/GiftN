<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corazón de flores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<!-- =============================================================== -->
<!-- 👉 Config de respaldo (se usa si no se encuentra el .json)   👈 -->
<!-- Puedes editar este bloque O el archivo flores-animacion.json    -->
<!-- =============================================================== -->
<script id="heart-config" type="application/json">
{
  "textos": {
    "titulo_superior": "Conmigo jamás serás espectadora",
    "texto_central": "Te amo",
    "mensaje_placeholder": "Lo hice con amor para ti, quizas no es algo fisico, pero al menos este durará por mucho tiempo, te amo preciosa y te quiero en mi vida por mucho tiempo y me gustaria que fueramos algo mas, contigo lo quiero, que dices? Nos arriesgamos a todo?",
    "firma_placeholder": "By.Yizan Contreras  ·  20/09/2026"
  },
  "colores_girasol": {
    "petalos": ["#FFC107", "#FFCA28", "#FDD835"],
    "centro": "#5D4037",
    "semillas": "#3E2723"
  },
  "fondo": {
    "colorPrincipal": "#020024",
    "colorSecundario": "#04083a",
    "colorEstrellas": "#ffffff",
    "cantidadEstrellas": 70
  },
  "animacion": {
    "cantidadFlores": 42,
    "jitterContorno": 0.04,
    "escalaCorazon_px": 16,
    "offsetY_px": -16,
    "duracionFloracionTotal_ms": 3200,
    "duracionBloom_s": 0.6,
    "duracionSwayMin_s": 3,
    "duracionSwayMax_s": 6,
    "tamanoFlorMin_px": 45,
    "tamanoFlorMax_px": 55
  }
}
</script>

<style>
  :root{
    --azul-1:#020024;
    --azul-2:#04083a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(circle at 50% 30%, var(--azul-2), var(--azul-1) 70%);
    overflow-x:hidden;
    font-family:'Poppins', sans-serif;
    color:#fdf6e3;
  }

  .cielo{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .estrella{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:#ffffff; opacity:.2;
    animation: parpadeo linear infinite;
  }
  @keyframes parpadeo{
    0%,100%{ opacity:.15; }
    50%{ opacity:.9; }
  }

  /* ======================= Pantalla de bienvenida ======================= */
  .pantalla-inicio{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 26px;
    background: radial-gradient(circle at 50% 40%, var(--azul-2), var(--azul-1) 75%);
    transition: opacity .8s ease, visibility .8s ease;
  }
  .pantalla-inicio.oculta{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .espero-texto{
    font-family:'Poppins', sans-serif;
    font-weight:300;
    font-size: clamp(18px, 3.2vw, 26px);
    letter-spacing: 2px;
    color:#ffffff;
    text-shadow: 0 0 18px rgba(255,255,255,.25);
    opacity:0;
    animation: aparecer 1.4s ease-out forwards;
    animation-delay: .3s;
  }
  .btn-presioname{
    position:relative;
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size: 15px;
    letter-spacing: 1.5px;
    color:#020024;
    background: linear-gradient(135deg, #fff6d8, #ffd54f 55%, #f5b400);
    border: none;
    padding: 14px 42px;
    border-radius: 40px;
    cursor:pointer;
    box-shadow: 0 0 18px rgba(255,213,79,.55), 0 6px 18px rgba(0,0,0,.35);
    opacity:0;
    animation: aparecer 1.4s ease-out forwards, respirar 2.6s ease-in-out infinite 1.8s;
    animation-delay: .8s;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .btn-presioname:hover{
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 0 26px rgba(255,213,79,.8), 0 8px 22px rgba(0,0,0,.4);
  }
  @keyframes respirar{
    0%,100%{ box-shadow: 0 0 18px rgba(255,213,79,.55), 0 6px 18px rgba(0,0,0,.35); }
    50%{ box-shadow: 0 0 30px rgba(255,213,79,.85), 0 6px 18px rgba(0,0,0,.35); }
  }

  .contenido{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    padding: 30px 16px 60px;
    text-align:center;
    opacity:0;
    transition: opacity 1s ease;
  }
  .contenido.visible{
    opacity:1;
  }

  .titulo-superior{
    font-family:'Great Vibes', cursive;
    font-size: clamp(20px, 4vw, 30px);
    font-weight:400;
    letter-spacing:.5px;
    color:#e8e2ff;
    opacity:0;
    max-width: 480px;
    margin: 6px 0 10px;
    animation: aparecer 1.4s ease-out forwards;
    animation-delay: .3s;
  }

  @keyframes aparecer{
    from{ opacity:0; transform:translateY(-8px); }
    to{ opacity:.95; transform:translateY(0); }
  }

  .heart-wrap{
    position:relative;
    width: 640px;
    height: 560px;
    max-width: 94vw;
    margin: 10px auto 0;
  }

  .flor{
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%) scale(0);
    opacity:0;
    filter: drop-shadow(0 0 4px rgba(255,220,90,.55));
    animation:
      brotar var(--bloom-dur) ease-out forwards var(--bloom-delay),
      vaiven var(--sway-dur) ease-in-out infinite var(--sway-delay);
  }
  .flor svg{ display:block; }

  @keyframes brotar{
    from{ opacity:0; transform: translate(-50%,-50%) scale(0) rotate(var(--rot,0deg)); }
    to{ opacity:1; transform: translate(-50%,-50%) scale(1) rotate(var(--rot,0deg)); }
  }
  @keyframes vaiven{
    0%,100%{ transform: translate(-50%,-50%) scale(1) rotate(var(--rot,0deg)); }
    50%{ transform: translate(-50%,-50%) scale(1.12) rotate(calc(var(--rot,0deg) + 5deg)); }
  }

  .texto-central{
    position:absolute;
    left:50%; top:53%;
    transform: translate(-50%,-50%) scale(.7);
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size: clamp(42px, 9vw, 72px);
    color:#fff8e1;
    text-shadow:
      0 0 12px rgba(255,215,90,.9),
      0 0 30px rgba(255,190,60,.6);
    opacity:0;
    white-space:nowrap;
    animation: latido-central .9s ease-out forwards;
    z-index:5;
  }
  @keyframes latido-central{
    from{ opacity:0; transform: translate(-50%,-50%) scale(.6); }
    60%{ opacity:1; transform: translate(-50%,-50%) scale(1.12); }
    to{ opacity:1; transform: translate(-50%,-50%) scale(1); }
  }

  /* ================================================================ */
  /* 👉 ZONA PARA TUS TEXTOS: reemplaza lo que está entre corchetes 👈 */
  /* ================================================================ */
  .mensajes-personales{
    margin-top: 28px;
    max-width: 520px;
    opacity:0;
    animation: aparecer 1.2s ease-out forwards;
    animation-delay: 3.6s;
  }
  .placeholder-text{
    font-size: 16px;
    line-height:1.6;
    color:#f5eecb;
    border: 1px dashed rgba(255,224,130,.5);
    border-radius: 10px;
    padding: 12px 16px;
    margin: 10px 0;
    background: rgba(255,255,255,0.03);
  }
  .firma{
    font-family:'Great Vibes', cursive;
    font-size: 22px;
    color:#ffe082;
    margin-top: 6px;
  }

  .btn-repetir{
    margin-top: 26px;
    background: transparent;
    border: 1px solid rgba(255,224,130,.5);
    color:#ffe082;
    padding: 8px 18px;
    border-radius: 20px;
    font-family:'Poppins', sans-serif;
    font-size: 13px;
    cursor:pointer;
    opacity:.8;
    transition: all .25s;
  }
  .btn-repetir:hover{
    opacity:1;
    background: rgba(255,224,130,.12);
  }
</style>
</head>
<body>

<div class="cielo" id="cielo"></div>

<!-- ============================================================ -->
<!-- 👉 Pantalla de bienvenida: cámbiala si quieres otro texto 👈 -->
<!-- ============================================================ -->
<div class="pantalla-inicio" id="pantallaInicio">
  <p class="espero-texto">Espero te guste mi niña.</p>
  <button class="btn-presioname" id="btnPresioname">Presióname</button>
</div>

<div class="contenido" id="contenido">

  <!-- Leyenda superior (fija, la pediste tal cual) -->
  <p class="titulo-superior" id="tituloSuperior"></p>

  <!-- Corazón de flores -->
  <div class="heart-wrap" id="heartWrap">
    <div class="texto-central" id="textoCentral"></div>
    <!-- las flores se generan aquí por JavaScript -->
  </div>

  <!-- ============================================================ -->
  <!-- 👉 PERSONALIZA AQUÍ: agrega tu propio texto o cámbialo 👈    -->
  <!-- ============================================================ -->
  <div class="mensajes-personales">
    <div class="placeholder-text" id="mensajePersonal">[Escribe aquí un mensaje especial para ella]</div>
    <div class="firma" id="firmaPersonal">[Tu nombre]  ·  [Fecha]</div>
  </div>

  <button class="btn-repetir" onclick="location.reload()">Repetir animación</button>
</div>

<script>
async function cargarConfig(){
  // Intenta usar el archivo externo flores-animacion.json (debe estar en la misma carpeta
  // y abrirse con un servidor local, ej: python -m http.server, por restricciones del navegador).
  try{
    const res = await fetch('./flores-animacion.json');
    if(res.ok){ return await res.json(); }
  }catch(e){ /* usamos el respaldo interno */ }
  return JSON.parse(document.getElementById('heart-config').textContent);
}

function svgGirasol(colorPetalo, colorCentro, colorSemillas, tam){
  const numPetalos = 16;
  let petalos = '';
  for(let i=0;i<numPetalos;i++){
    const angulo = (360/numPetalos)*i;
    petalos += `<ellipse cx="30" cy="7" rx="6.5" ry="15" fill="${colorPetalo}" opacity="0.97" transform="rotate(${angulo} 30 30)"/>`;
  }
  let semillas = '';
  for(let r=1;r<=3;r++){
    const radio = r*3.4;
    const cantidad = r*6;
    for(let s=0;s<cantidad;s++){
      const ang = (360/cantidad)*s + r*18;
      const rad = ang * Math.PI/180;
      const cx = 30 + radio*Math.cos(rad);
      const cy = 30 + radio*Math.sin(rad);
      semillas += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="1.2" fill="${colorSemillas}"/>`;
    }
  }
  return `<svg width="${tam}" height="${tam}" viewBox="0 0 60 60">
      ${petalos}
      <circle cx="30" cy="30" r="12" fill="${colorCentro}"/>
      ${semillas}
    </svg>`;
}

function contornoCorazon(n, jitter){
  const pts = [];
  for(let i=0;i<n;i++){
    const t = (i/n)*Math.PI*2;
    const j = 1 + (Math.random()-0.5)*jitter*2;
    const x = 16*Math.pow(Math.sin(t),3) * j;
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * j;
    pts.push({x, y});
  }
  return pts;
}

function crearEstrellas(cantidad, color){
  const cielo = document.getElementById('cielo');
  for(let i=0;i<cantidad;i++){
    const e = document.createElement('div');
    e.className = 'estrella';
    e.style.left = Math.random()*100 + '%';
    e.style.top = Math.random()*100 + '%';
    e.style.background = color;
    e.style.animationDuration = (2 + Math.random()*4) + 's';
    e.style.animationDelay = (Math.random()*4) + 's';
    cielo.appendChild(e);
  }
}

function generarCorazon(cfg){
  const a = cfg.animacion;
  const gir = cfg.colores_girasol;
  const puntos = contornoCorazon(a.cantidadFlores, a.jitterContorno);
  const wrap = document.getElementById('heartWrap');
  const total = puntos.length;

  puntos.forEach((p, idx)=>{
    const flor = document.createElement('div');
    flor.className = 'flor';

    const colorPetalo = gir.petalos[Math.floor(Math.random()*gir.petalos.length)];
    const tam = a.tamanoFlorMin_px + Math.random()*(a.tamanoFlorMax_px - a.tamanoFlorMin_px);
    const rot = Math.floor(Math.random()*360);
    const swayDur = a.duracionSwayMin_s + Math.random()*(a.duracionSwayMax_s - a.duracionSwayMin_s);
    const bloomDelay = (idx/total) * (a.duracionFloracionTotal_ms/1000);

    flor.style.left = `calc(50% + ${p.x * a.escalaCorazon_px}px)`;
    flor.style.top  = `calc(50% + ${(p.y * a.escalaCorazon_px) + a.offsetY_px}px)`;
    flor.style.setProperty('--rot', rot + 'deg');
    flor.style.setProperty('--bloom-dur', a.duracionBloom_s + 's');
    flor.style.setProperty('--bloom-delay', bloomDelay + 's');
    flor.style.setProperty('--sway-dur', swayDur + 's');
    flor.style.setProperty('--sway-delay', (bloomDelay + a.duracionBloom_s) + 's');

    flor.innerHTML = svgGirasol(colorPetalo, gir.centro, gir.semillas, tam);
    wrap.appendChild(flor);
  });

  // el texto central aparece justo cuando termina de florecer el corazón
  document.getElementById('textoCentral').style.animationDelay =
    (a.duracionFloracionTotal_ms/1000) + 's';
}

(async function preparar(){
  const cfg = await cargarConfig();

  document.documentElement.style.setProperty('--azul-1', cfg.fondo.colorPrincipal);
  document.documentElement.style.setProperty('--azul-2', cfg.fondo.colorSecundario);

  document.getElementById('tituloSuperior').textContent = cfg.textos.titulo_superior;
  document.getElementById('textoCentral').textContent = cfg.textos.texto_central;
  document.getElementById('mensajePersonal').textContent = cfg.textos.mensaje_placeholder;
  document.getElementById('firmaPersonal').textContent = cfg.textos.firma_placeholder;

  // el cielo estrellado se ve también en la pantalla de bienvenida
  crearEstrellas(cfg.fondo.cantidadEstrellas, cfg.fondo.colorEstrellas);

  // el corazón de flores solo se construye cuando el usuario presiona el botón
  document.getElementById('btnPresioname').addEventListener('click', ()=>{
    document.getElementById('pantallaInicio').classList.add('oculta');
    document.getElementById('contenido').classList.add('visible');
    generarCorazon(cfg);
  });
})();
</script>

</body>
</html>
